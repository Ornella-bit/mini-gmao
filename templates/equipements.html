{% extends "base.html" %}
{% block contenu %}
<h1>Équipements</h1>
<p><a href="/equipements/ajouter">+ Ajouter un équipement</a></p>
<table border="1" cellpadding="6">
    <tr><th>Nom</th><th>Catégorie</th><th>Lieu</th><th>État</th><th>Actions</th></tr>
    {% for e in equipements %}
    <tr>
        <td><a href="{{ url_for('detail_equipement', equipement_id=e['id']) }}">{{ e["nom"] }}</a></td>
        <td>{{ e["categorie"] }}</td>
        <td>{{ e["lieu"] }}</td>
        <td>{{ e["etat"] }}</td>
        <td>
            <a href="{{ url_for('modifier_equipement', equipement_id=e['id']) }}">Modifier</a>
            <form method="post" action="{{ url_for('supprimer_equipement', equipement_id=e['id']) }}"
                  style="display:inline"
                  onsubmit="return confirm('Supprimer cet équipement ?');">
                <button type="submit">Supprimer</button>
            </form>
        </td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
