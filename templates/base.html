<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mini-GMAO</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    {% set chemin = request.path %}
    <nav>
        <a href="/" class="{% if chemin == '/' %}actif{% endif %}">Accueil</a>
        <a href="/equipements" class="{% if chemin.startswith('/equipements') %}actif{% endif %}">Équipements</a>
        <a href="/pannes" class="{% if chemin.startswith('/pannes') %}actif{% endif %}">Pannes</a>
        <a href="/pieces" class="{% if chemin.startswith('/pieces') %}actif{% endif %}">Stock</a>
    </nav>
    <main>
        {% block contenu %}{% endblock %}
    </main>
</body>
</html>
