{% extends "base.html" %}
{% block contenu %}
<h1>Pannes</h1>
<p><a href="{{ url_for('declarer_panne') }}">+ Déclarer une panne</a></p>
<table border="1" cellpadding="6">
    <tr><th>Date</th><th>Équipement</th><th>Description</th><th>Gravité</th><th>Statut</th></tr>
    {% for p in pannes %}
    <tr>
        <td>{{ p["date_declaration"] }}</td>
        <td>{{ p["equipement"] }}</td>
        <td>{{ p["description"] }}</td>
        <td>{{ p["gravite"] }}</td>
        <td>
            <form method="post" action="{{ url_for('changer_statut_panne', panne_id=p['id']) }}">
                <select name="statut" onchange="this.form.submit()">
                    {% for s in ["Ouverte", "En cours", "Résolue"] %}
                    <option {% if s == p['statut'] %}selected{% endif %}>{{ s }}</option>
                    {% endfor %}
                </select>
            </form>
        </td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
